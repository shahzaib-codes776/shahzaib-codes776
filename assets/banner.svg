<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Shahzaib Shoukat — Frontend Developer and Co-Founder at CelVoxe" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B1F"/>
      <stop offset="0.55" stop-color="#0B1E3F"/>
      <stop offset="1" stop-color="#0E4A63"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <!-- floating glow orbs -->
    <circle cx="150" cy="70" r="170" fill="url(#glowCyan)">
      <animate attributeName="cx" values="150;230;150" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;120;70" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="240" r="190" fill="url(#glowBlue)">
      <animate attributeName="cx" values="860;780;860" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="240;180;240" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- decorative code glyphs -->
    <text x="70" y="250" font-family="Consolas, 'Courier New', monospace" font-size="120" fill="#22D3EE" fill-opacity="0.08">&lt;/&gt;</text>
    <text x="800" y="120" font-family="Consolas, 'Courier New', monospace" font-size="90" fill="#FFFFFF" fill-opacity="0.06">{ }</text>

    <!-- content -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="500" y="135" font-size="68" font-weight="700" fill="url(#nameFill)" letter-spacing="1">
        Shahzaib Shoukat
        <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
      </text>
      <text x="500" y="185" font-size="30" font-weight="600" fill="#E0F2FE">
        Frontend Developer  |  Co-Founder @ CelVoxe
        <animate attributeName="opacity" values="0;1" dur="1.8s" fill="freeze"/>
      </text>
      <text x="500" y="232" font-size="24" fill="#67E8F9" letter-spacing="3">
        REACT  ·  NEXT.JS  ·  NODE.JS  ·  AI
        <animate attributeName="opacity" values="0;1" dur="2.4s" fill="freeze"/>
      </text>
    </g>

    <!-- animated accent line -->
    <rect x="300" y="252" width="400" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="998" height="298" rx="17" fill="none" stroke="#22D3EE" stroke-opacity="0.25" stroke-width="2"/>
</svg>
